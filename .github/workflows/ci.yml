# FBL-000 — Reproducible Baseline (as corrected by FBL-000-R1).
#
# Every job runs from a clean clone with a locked install. The database-backed suites
# are REQUIRED here: REQUIRE_DB_TESTS=1 turns the local "skip without a database"
# behavior into a hard failure, and scripts/parse-test-summary.ts enforces a non-empty,
# internally consistent summary with failed=0 and skipped=0 — it depends on no reporter
# glyph, color, or locale (the original grep expected the spec reporter's "ℹ" while
# Node 20 on a non-TTY emitted TAP's "#", which failed a fully passing run).
#
# No secret literals live in this file: test-only values are generated per run and
# masked. Actions are pinned by commit SHA and container images by digest; Dependabot
# (.github/dependabot.yml) is the approved mechanism that proposes updates to both.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck, lint ratchet, build, all tests, scans
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cockpit_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cockpit_ci_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cockpit_ci_test
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Locked install
        run: npm ci

      - name: Tool versions (artifact input)
        run: |
          set -o pipefail
          mkdir -p artifacts
          { echo "node=$(node --version)"; echo "npm=$(npm --version)";
            echo "tsc=$(npx tsc --version)"; echo "eslint=$(npx eslint --version)";
            echo "prettier=$(npx prettier --version)";
            echo "postgres_image=postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777";
          } | tee artifacts/tool-versions.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Quality ratchet (strictness + lint + format, no new debt)
        run: npm run ratchet:check

      - name: Format check (ratcheted formatting baseline)
        run: npm run format:check

      - name: Architecture check (dependency rules, ownership manifest, env confinement)
        run: npm run architecture:check

      - name: 'Build (workspace builds: api, worker, web, scripts)'
        run: npm run build

      # The worker's wiring, proved WITHOUT a schema: --list-jobs touches no database, so
      # this step also proves the job registry is reachable from the compiled entry point
      # before migrations have run.
      #
      # FBL-020-R5 §4.8: ALL THREE sweeps are grepped, not just the first. Greping one
      # name is what let the login-transaction and step-up sweeps stay unregistered for
      # four revisions while this step stayed green.
      - name: Worker job registry smoke test
        run: |
          set -o pipefail
          node apps/worker/dist/main.js --list-jobs | tee artifacts/worker-smoke.txt
          grep -q 'identity.support_access.expiry' artifacts/worker-smoke.txt
          grep -q 'identity.login_transaction.expiry' artifacts/worker-smoke.txt
          grep -q 'identity.reauthentication_transaction.expiry' artifacts/worker-smoke.txt

      - name: Migrations apply from an empty database
        run: npm run migrate

      # …and the job's REAL pass, against the migrated database, from the compiled output.
      # FBL-020-R4 §4: the expiry transition must be production-reachable, so CI runs the
      # very entry point the deployment runs rather than asserting that a function exists.
      - name: Worker support-expiry pass (compiled, against the real schema)
        run: |
          set -o pipefail
          node apps/worker/dist/main.js --once 2>&1 | tee artifacts/worker-expiry-pass.txt
          grep -q '"mode":"once"' artifacts/worker-expiry-pass.txt

      - name: Migration idempotency (second run applies nothing)
        run: |
          set -o pipefail
          npm run migrate 2>&1 | tee artifacts/migrate-second-run.log
          grep -q '"applied":0' artifacts/migrate-second-run.log

      - name: Migration manifest (filenames + canonical-LF SHA-256)
        run: npx tsx scripts/migration-manifest.ts migrations --out artifacts/migration-manifest.json

      # FBL-020-R5 §0.6: EVERY reconciliation in 057 is either covered by a negative control
      # or declared, with its reason, in architecture/reconciliation-inventory-057.json. The
      # control coverage is COMPUTED from each control's anchors, so it cannot be overstated
      # the way R4's prose was. An unaccounted reconciliation fails this step.
      # FBL-020-R5 §0.1 — THE CENSUS RUNS HERE TOO, AND WHAT THAT DOES AND DOES NOT SHOW.
      #
      # A census is a statement about the machine it runs on, so THIS run reports the RUNNER:
      # it proves the script executes on a clean host and records that the runner holds no
      # persistent PostgreSQL of its own. The §0.2 decision rests on the census taken on the
      # implementer's machine, which is delivered as its own artifact and quoted in
      # docs/FBL-020-DELIVERY-REPORT.md §0. This step is therefore EVIDENCE, NOT A GATE: it
      # asserts the artifact exists and is non-empty and nothing else, because a runner cannot
      # observe the environments the order asks about.
      - name: Persistent-environment census (this runner; evidence, not a gate)
        run: |
          set -o pipefail
          npx tsx scripts/migration-census.ts --out artifacts/migration-census.json \
            --log artifacts/migration-census.txt
          grep -q '"acceptance": "NOT_REVIEWED"' artifacts/migration-census.json

      # FBL-020-R5 gate finding G5 — THIS ONE IS A GATE.
      #
      # The census above is evidence about the runner and cannot decide §0.2. What CAN be
      # decided anywhere, on any host, is whether the delivery documents state the position
      # the census artifact in front of them actually carries. R5 shipped an artifact
      # concluding FREEZE 057 alongside a report and a requirement map asserting the
      # opposite branch, with 057 edited in place and no 058 — and nothing compared them.
      # This step compares them, and fails the run when they disagree.
      - name: Census position vs delivery prose (the artifact and the documents must agree)
        run: npx tsx scripts/check-census-prose.ts

      - name: Reconciliation inventory of 057 (every reconciliation accounted for)
        run: |
          set -o pipefail
          npx tsx scripts/reconciliation-inventory.ts \
            --out artifacts/reconciliation-inventory-057.json \
            --log artifacts/reconciliation-inventory-057.txt
          grep -q '"reconciliations_unaccounted": 0' artifacts/reconciliation-inventory-057.json

      - name: Application starts and readiness succeeds (compiled output)
        run: |
          node apps/api/dist/server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > artifacts/healthz.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat artifacts/healthz.json
          curl -fsS http://127.0.0.1:3000/metrics | head -5 > artifacts/metrics-head.txt
          kill "$(cat server.pid)"

      - name: All declared tests (zero skipped required suites)
        run: |
          set -o pipefail
          npx tsx --test --test-concurrency=1 --test-reporter=tap --test-reporter-destination=stdout \
            tests/*.test.ts 2>&1 | tee artifacts/test-output.log

      # FBL-020-R4 §7: all eight summary fields REQUIRED (`todo` among them, which R3 read
      # but did not require), and the run must be at least as large as the declared floors.
      # A suite that SHRANK is the commonest way coverage silently disappears, and it is
      # invisible in a green log.
      - name: Enforce test summary (all eight fields, floors, zero failed/cancelled/skipped/todo)
        run: npx tsx scripts/parse-test-summary.ts artifacts/test-output.log artifacts/test-summary.json

      - name: Requirement map (every R5 clause is covered and every requirement resolves to tests that exist)
        run: |
          set -o pipefail
          npx tsx scripts/check-requirement-map.ts --out artifacts/requirement-map-check.txt

      # FBL-020-R4 §7: the suite being green is not evidence that the suite is HOLDING
      # anything — R3's review found a test that passed with a security predicate deleted.
      # Each control is removed in an isolated copy of the tree and its named test must
      # die. A mutation that survives fails the job.
      - name: Mutation-kill checks (isolated copy of the tree)
        run: |
          set -o pipefail
          npx tsx scripts/mutation-kill.ts --out artifacts/mutation-kill.json \
            --log artifacts/mutation-kill.txt
          grep -q '"mutations_survived": 0' artifacts/mutation-kill.json

      # FBL-020-R5 §3.3: no delivery document may publish a figure that disagrees with the
      # run or the constant producing it. This step runs AFTER the summary parser and the
      # mutation runner precisely because it reads their artifacts; the same comparison
      # runs in-suite against whatever artifacts exist there.
      - name: Published figures vs their artifacts (no figure is retyped)
        run: |
          set -o pipefail
          npx tsx scripts/check-published-figures.ts | tee artifacts/published-figures.txt
          npx tsx scripts/check-published-figures.ts --list > artifacts/published-figures.tsv

      - name: Schema fingerprint (fresh chain)
        run: |
          set -o pipefail
          npx tsx scripts/schema-fingerprint.ts --out artifacts/schema-fingerprint.json | tee artifacts/schema-fingerprint.txt

      - name: Dependency audit (gate on high/critical)
        run: |
          npm audit --json > artifacts/npm-audit.json || true
          npm audit --audit-level=high

      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > artifacts/sbom.cdx.json

      - name: Evidence completeness (every required artifact exists and is non-empty)
        run: |
          for f in tool-versions.txt migrate-second-run.log migration-manifest.json healthz.json \
                   worker-smoke.txt worker-expiry-pass.txt \
                   test-output.log test-summary.json schema-fingerprint.json schema-fingerprint.txt \
                   requirement-map-check.txt mutation-kill.json mutation-kill.txt \
                   published-figures.txt published-figures.tsv \
                   reconciliation-inventory-057.json reconciliation-inventory-057.txt \
                   migration-census.json migration-census.txt \
                   npm-audit.json sbom.cdx.json; do
            test -s "artifacts/$f" || { echo "MISSING OR EMPTY: artifacts/$f"; exit 1; }
          done
          echo "all baseline-evidence artifacts present and non-empty"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: baseline-evidence
          path: artifacts/

  # FBL-020-R4 §6 — THE UPGRADE JOB NOW PROVES SOMETHING.
  #
  # Until R4 this job seeded Fixed Ops rows only, and scripts/verify-upgrade-state.ts
  # REQUIRED every identity table to be EMPTY. Migration 057 — a file whose whole
  # subject is reconciling RETAINED IDENTITY ROWS before it constrains them — was
  # therefore only ever exercised against zero rows, and every "the constraint would
  # abort here if it preceded this statement" claim in it was unproven by the gate that
  # existed to prove it. The R3 report's populated-upgrade claim rested on a local,
  # prose-only exercise; it was not a CI gate and is not offered as one now.
  #
  # The job applies the retained schema, seeds Fixed Ops data, migrates to the last
  # PRE-057 migration, asserts 055/056 invented no identities (the old assertion, kept
  # at the point where it is true), seeds NONEMPTY legacy identity data, asserts that
  # fixture is really there, runs the NEGATIVE CONTROLS on isolated copies, applies 057,
  # and asserts the exact reconciled state of every seeded row plus nonzero and
  # unchanged before/after counts. Then it compares fresh and upgraded fingerprints.
  migration-upgrade:
    name: populated upgrade drill + reconciliation negative controls
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cockpit_upgrade_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cockpit_upgrade_test
      FRESH_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cockpit_fresh_check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Locked install
        run: npm ci

      # FBL-020-R5 §0.5: the retained fixture is COMPARED against FIXED COMMITTED DIGESTS in
      # architecture/migration-fixture-chains.json, not merely recorded. The previous step was
      # named "must stay byte-identical to f76a27a" and could not detect that it had not: it
      # wrote down whatever it found and the job carried on.
      - name: Retained fixture must match its committed digests (f76a27a)
        run: |
          set -o pipefail
          mkdir -p artifacts
          npx tsx scripts/migration-manifest.ts tests/fixtures/schema-f76a27a \
            --expect-chain schema-f76a27a --out artifacts/fixture-checksums.json
          grep -q '"comparison": "OK"' artifacts/fixture-checksums.json

      # FBL-020-R5 §0.4: a migrations directory that is not the canonical one must be opted
      # into BY NAME, and the runner then requires the directory to match the chain's declared
      # filenames and digests exactly. It weakens no ledger refusal: a body this directory
      # withholds is still resolved from migrations/ and still verified there.
      - name: Apply the earliest retained schema (f76a27a; migrations 000 + 049)
        run: |
          set -o pipefail
          MIGRATIONS_DIR=tests/fixtures/schema-f76a27a MIGRATION_FIXTURE_CHAIN=schema-f76a27a \
            npm run migrate 2>&1 | tee artifacts/upgrade-log.txt
          grep -q '"mode":"fixture"' artifacts/upgrade-log.txt

      - name: Seed legacy Fixed Ops data that schema allowed
        run: |
          set -o pipefail
          node -e "const{readFileSync}=require('fs');const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query(readFileSync(process.argv[1],'utf8'));await c.end();console.log('seed applied: '+process.argv[1]);})().catch(e=>{console.error(e);process.exit(1);})" tests/fixtures/legacy-seed-f76a27a.sql 2>&1 | tee -a artifacts/upgrade-log.txt

      # The chain UP TO but NOT INCLUDING 057, so the identity fixture can be seeded
      # against the schema a retained database would actually have had. Staged as a copy
      # rather than by a new runner flag: MIGRATIONS_DIR already exists for exactly this
      # (the retained two-file fixture above uses it), the copies are byte-identical, so
      # the checksum ledger verifies them against migrations/ on the next full run.
      #
      # The file count is ASSERTED. When a migration 058 is added this step FAILS, which
      # forces a decision about which side of the boundary it belongs on instead of
      # silently seeding against the wrong schema.
      - name: Stage the pre-057 chain
        run: |
          set -o pipefail
          PRE057="$RUNNER_TEMP/pre057-migrations"
          mkdir -p "$PRE057"
          cp migrations/*.sql "$PRE057/"
          rm -f "$PRE057/057_identity_boundary_completion.sql"
          ls -1 "$PRE057" | tee artifacts/pre-057-chain.txt
          test "$(ls -1 "$PRE057" | wc -l)" -eq 9
          ! grep -q '^057_' artifacts/pre-057-chain.txt
          echo "PRE057=$PRE057" >> "$GITHUB_ENV"

      - name: Migrate through the last PRE-057 migration (050..056)
        run: |
          set -o pipefail
          MIGRATIONS_DIR="$PRE057" MIGRATION_FIXTURE_CHAIN=pre-057 \
            npm run migrate 2>&1 | tee -a artifacts/upgrade-log.txt

      # The assertion the previous version of this job made as its ONLY assertion, kept
      # at the one point where it is a true statement about 055/056: before any identity
      # row exists, those migrations must have invented none.
      - name: Verify the organization backfill invented no identities (phase=backfill)
        run: |
          set -o pipefail
          npx tsx scripts/verify-upgrade-state.ts --phase=backfill \
            --out artifacts/upgrade-backfill.json | tee artifacts/upgrade-backfill.txt

      - name: Seed NONEMPTY legacy identity data (pre-057 schema)
        run: |
          set -o pipefail
          node -e "const{readFileSync}=require('fs');const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query(readFileSync(process.argv[1],'utf8'));await c.end();console.log('seed applied: '+process.argv[1]);})().catch(e=>{console.error(e);process.exit(1);})" tests/fixtures/legacy-identity-seed-pre-057.sql 2>&1 | tee -a artifacts/upgrade-log.txt

      # An empty or partial fixture can no longer be mistaken for a pass: this step
      # fails if ANY identity table is empty, and records the exact census 057 will be
      # measured against.
      - name: Verify the identity fixture is present and NONEMPTY (phase=pre-057)
        run: |
          set -o pipefail
          npx tsx scripts/verify-upgrade-state.ts --phase=pre-057 \
            --out artifacts/identity-pre-057.json | tee artifacts/identity-pre-057.txt
          grep -q '"result": "OK"' artifacts/identity-pre-057.json

      # THE RECONCILIATIONS ARE PROVED LOAD-BEARING, IN CI, NOT BY HAND. Each control
      # copies this database (CREATE DATABASE … TEMPLATE), deletes ONE reconciliation
      # from 057, and requires the intended refusal — a named Postgres constraint, or a
      # named verifier assertion. A control whose removal changes nothing FAILS the job.
      - name: Reconciliation negative controls (isolated copies of the pre-057 database)
        run: |
          set -o pipefail
          npx tsx scripts/upgrade-negative-controls.ts \
            --before artifacts/identity-pre-057.json \
            --out artifacts/negative-controls.json \
            --log artifacts/negative-controls.txt
          grep -q '"controls_failed": 0' artifacts/negative-controls.json
          # `--only` exists for the revert-proof loop; a narrowed run must never stand in for
          # the gate, so the artifact records that it was narrowed and this asserts it was not.
          grep -q '"controls_filtered": false' artifacts/negative-controls.json

      - name: Apply 057 on top of the populated legacy data
        run: |
          set -o pipefail
          npm run migrate 2>&1 | tee -a artifacts/upgrade-log.txt

      # The reconciled state, row by row, plus nonzero and UNCHANGED before/after counts:
      # 057 reconciles by changing state, never by deleting the evidence of a problem.
      - name: Verify the reconciled state and before/after counts (phase=post-057)
        run: |
          set -o pipefail
          npx tsx scripts/verify-upgrade-state.ts --phase=post-057 \
            --before artifacts/identity-pre-057.json \
            --out artifacts/identity-post-057.json | tee artifacts/constraint-state.txt
          grep -q '"result": "OK"' artifacts/identity-post-057.json

      # FBL-020-R5 §0.3 and §0.4, exercised against the very database this job just built:
      # the refusals have to hold on a real migrated schema, not only on the probe fixtures the
      # suite uses. Each probe runs on a COPY, so the drill database is left exactly as it was.
      - name: Ledger and fixture-mode refusals (probed on copies of the upgraded database)
        run: |
          set -o pipefail
          npx tsx scripts/migrate-refusal-probe.ts --out artifacts/refusal-probes.json \
            --log artifacts/refusal-probes.txt
          grep -q '"probes_failed": 0' artifacts/refusal-probes.json

      - name: Fingerprint the upgraded schema
        run: |
          set -o pipefail
          npx tsx scripts/schema-fingerprint.ts --out artifacts/upgraded-schema-fingerprint.json | tee artifacts/upgraded-schema-fingerprint.txt

      - name: Fresh chain in a second database
        run: |
          set -o pipefail
          node -e "const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query('CREATE DATABASE cockpit_fresh_check');await c.end();})().catch(e=>{console.error(e);process.exit(1);})"
          DATABASE_URL="$FRESH_DATABASE_URL" npm run migrate
          DATABASE_URL="$FRESH_DATABASE_URL" npx tsx scripts/schema-fingerprint.ts --out artifacts/fresh-schema-fingerprint.json | tee artifacts/fresh-schema-fingerprint.txt

      - name: Fingerprints must be identical (fresh chain vs upgrade path)
        run: |
          set -o pipefail
          FRESH=$(grep -oE 'schema_fingerprint_sha256=[0-9a-f]{64}' artifacts/fresh-schema-fingerprint.txt | cut -d= -f2)
          UPGRADED=$(grep -oE 'schema_fingerprint_sha256=[0-9a-f]{64}' artifacts/upgraded-schema-fingerprint.txt | cut -d= -f2)
          { echo "fresh=$FRESH"; echo "upgraded=$UPGRADED"; } | tee artifacts/fingerprint-equality.txt
          test -n "$FRESH"
          test -n "$UPGRADED"
          test "$FRESH" = "$UPGRADED"
          echo "equal=true" | tee -a artifacts/fingerprint-equality.txt

      - name: Application starts against the upgraded database
        run: |
          npx tsc -b apps/api
          node apps/api/dist/server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > artifacts/upgraded-healthz.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat artifacts/upgraded-healthz.json
          kill "$(cat server.pid)"

      - name: Evidence completeness (every required artifact exists and is non-empty)
        run: |
          for f in fixture-checksums.json upgrade-log.txt constraint-state.txt \
                   pre-057-chain.txt upgrade-backfill.txt upgrade-backfill.json \
                   identity-pre-057.txt identity-pre-057.json identity-post-057.json \
                   negative-controls.txt negative-controls.json \
                   refusal-probes.txt refusal-probes.json \
                   upgraded-schema-fingerprint.json fresh-schema-fingerprint.json \
                   fingerprint-equality.txt upgraded-healthz.json; do
            test -s "artifacts/$f" || { echo "MISSING OR EMPTY: artifacts/$f"; exit 1; }
          done
          echo "all upgrade-evidence artifacts present and non-empty"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: upgrade-evidence
          path: artifacts/

  container:
    name: container build (digest-pinned base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image and record digest, runtime user, healthcheck
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker build --iidfile artifacts/image-id.txt -t service-cockpit:ci .
          docker image inspect service-cockpit:ci --format '{{.Id}}' | tee artifacts/image-digest.txt
          { echo "runtime_user=$(docker image inspect service-cockpit:ci --format '{{.Config.User}}')";
            echo "healthcheck=$(docker image inspect service-cockpit:ci --format '{{json .Config.Healthcheck}}')";
            echo "exposed_ports=$(docker image inspect service-cockpit:ci --format '{{json .Config.ExposedPorts}}')";
          } | tee artifacts/container-config.txt
          test -s artifacts/image-digest.txt
          grep -q 'runtime_user=cockpit' artifacts/container-config.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/

  secret-scan:
    name: secret scan (genuine full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Full-history gitleaks scan (pinned image, --log-opts=--all)
        run: |
          set -o pipefail
          mkdir -p artifacts
          IMAGE='zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055'
          REVISIONS=$(git rev-list --all --count)
          BRANCHES=$(git branch -r | wc -l)
          CMD="git --log-opts=--all --redact -v --report-format=sarif --report-path=/repo/artifacts/gitleaks.sarif /repo"
          { echo "scanner=gitleaks";
            echo "image=$IMAGE";
            echo "version=$(docker run --rm "$IMAGE" version)";
            echo "command=gitleaks $CMD";
            echo "scope=full history via --log-opts=--all";
            echo "revisions_scanned=$REVISIONS";
            echo "remote_branches=$BRANCHES";
            echo "suppressions=.gitleaksignore (exact finding fingerprints only, see file)";
          } | tee artifacts/scan-evidence.txt
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$IMAGE" $CMD 2>&1 | tail -20 | tee -a artifacts/scan-evidence.txt
          test -s artifacts/gitleaks.sarif
          cp .gitleaksignore artifacts/suppressions.txt

