# Local/single-host deployment: postgres, a one-shot migration run, and the API.
# Adapted from the origin platform's compose file with everything the repo has no code
# for removed (redis, minio, scheduler, five worker pools) and its fail-open defaults
# inverted: POSTGRES_PASSWORD has NO fallback — `${VAR:?...}` makes compose refuse to
# start rather than boot with a well-known secret.
#
# Identity (FBL-020) is OPTIONAL here: leaving the WORKOS_* block empty starts the
# stack with the /auth surface disabled. Setting IDENTITY_PROVIDER=workos makes every
# WORKOS_* / OIDC_* variable REQUIRED, and loadConfig refuses to start without them.
#
#   cp .env.example .env   # fill in POSTGRES_PASSWORD (and the WORKOS_* block to serve logins)
#   docker compose up --build
#
# Compose reads .env from this directory automatically. Never commit the real .env.

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: cockpit
    # Not published to the host by default. Uncomment for local psql access:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cockpit -d cockpit']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # One-shot: applies migrations/ in filename order against schema_migrations, then
  # exits. The api service waits for it to complete successfully, so the API never
  # boots against an empty or half-migrated schema. Uses the compiled migrate runner —
  # the production image has no tsx.
  migrate:
    build: .
    command: ['node', 'scripts/dist/migrate.js']
    environment:
      DATABASE_URL: postgres://cockpit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cockpit
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://cockpit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cockpit
      # Identity is OPTIONAL here: unset means the /auth surface does not serve and
      # the stack still boots for schema/API work. Set IDENTITY_PROVIDER=workos and
      # the rest to exercise real logins; loadConfig then requires every one of them.
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_ISSUER: ${WORKOS_ISSUER:-}
      WORKOS_JWKS_URI: ${WORKOS_JWKS_URI:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
      WORKOS_REAUTH_REDIRECT_URI: ${WORKOS_REAUTH_REDIRECT_URI:-}
      WORKOS_LOGOUT_REDIRECT_URI: ${WORKOS_LOGOUT_REDIRECT_URI:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # FBL-020-R4 section 4 — the background process, and the reason it is deployed.
  #
  # A delegated support-access window closes on its own schedule, so the transition that
  # RECORDS the closing (one row, one advancing authorization version, one audit event) has
  # no request to hang off. This service runs it on a bounded interval. It serves no
  # traffic, exposes no port, and needs nothing but the database.
  #
  # It is NOT a queue and not a scheduler: the job's exactly-once property comes from the
  # database claim itself, so running two of these — or none for an hour — is safe. Access
  # stops at the session's own expiry whether or not this process is running; what depends
  # on it is the COMPLETENESS OF THE AUDIT TRAIL.
  worker:
    build: .
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cockpit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cockpit
      SUPPORT_ACCESS_EXPIRY_INTERVAL_MS: ${SUPPORT_ACCESS_EXPIRY_INTERVAL_MS:-60000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # /metrics and /healthz are unauthenticated by design (README "Observability") — in any
  # deployment where port 3000 is reachable from outside, gate them at the ingress.

volumes:
  postgres_data:
